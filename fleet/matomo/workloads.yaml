{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "db",
    "namespace": "matomo"
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "db"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "db"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "args": [
              "--max-allowed-packet=64MB"
            ],
            "command": [
              "docker-entrypoint.sh"
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "db-env"
                }
              }
            ],
            "image": "mariadb@sha256:beda104493ec7b25249451de5e331caa5cab3de93fcc554add8d3dce7bb2c32e",
            "imagePullPolicy": "IfNotPresent",
            "name": "db",
            "ports": [
              {
                "containerPort": 3306,
                "name": "p3306-tcp",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "periodSeconds": 10,
              "successThreshold": 1,
              "tcpSocket": {
                "port": 3306
              },
              "timeoutSeconds": 1
            },
            "resources": {
              "requests": {
                "cpu": "25m",
                "memory": "64Mi"
              }
            },
            "startupProbe": {
              "failureThreshold": 180,
              "periodSeconds": 10,
              "successThreshold": 1,
              "tcpSocket": {
                "port": 3306
              },
              "timeoutSeconds": 1
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/var/lib/mysql",
                "name": "v-10afb5681061ff1f"
              },
              {
                "mountPath": "/dev/shm",
                "name": "shm"
              }
            ]
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "imagePullSecrets": [
          {
            "name": "registry-credentials"
          }
        ],
        "nodeSelector": {
          "kubernetes.io/hostname": "spainip-k3s"
        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 120,
        "volumes": [
          {
            "name": "v-10afb5681061ff1f",
            "persistentVolumeClaim": {
              "claimName": "v-10afb5681061ff1f"
            }
          },
          {
            "emptyDir": {
              "medium": "Memory",
              "sizeLimit": "67108864"
            },
            "name": "shm"
          }
        ]
      }
    }
  }
}
